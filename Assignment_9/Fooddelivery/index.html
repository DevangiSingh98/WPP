<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foodie Express</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Header Section -->
  <header>
    <div class="logo">Foodie Express</div>
    <nav>
      <a href="#">Login</a>
      <a href="#">Signup</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Discover the Best Food & Drinks</h1>
    <p>Order from your favorite restaurants and enjoy at home</p>
    <div class="search-bar">
      <input type="text" placeholder="What dish is on your mind today?😋" />
      <button>Search</button>
    </div>
  </section>

  <!-- Food Gallery Section -->
  <section class="gallery">
    <h2>Popular Dishes</h2>
    <div class="images">
      <img src="images/burger.png" alt="Burger">
      <img src="images/pizza.png" alt="Pizza">
      <img src="images/shawarma.png" alt="Shawarma">
      <img src="images/coke.png" alt="Cold Drink">
    </div>
  </section>

  <!-- Footer Section -->
  <footer>
    <p>&copy; Foodie Express | Designed by Devangi Singh</p>
  </footer>

</body>
</html>
